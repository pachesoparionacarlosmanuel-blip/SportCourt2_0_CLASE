<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://images.unsplash.com data:; font-src 'self'; connect-src 'self' http://localhost:8080 http://127.0.0.1:8080; object-src 'none'; base-uri 'self'; form-action 'self';">
  <title>SportCourt Perú - Mis Reservas</title>
  <link rel="stylesheet" href="assets/css/app.min.css">
</head>

<body data-page="reservas">

  <nav class="navbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">SC</span>
      <span class="brand-name">SportCourt <span>Perú</span></span>
    </a>
    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="canchas.html">Canchas</a>
      <a href="clases.html">Clases</a>
      <a href="reservas.html" class="active">Mis Reservas</a>
      <a href="perfil.html">Perfil</a>
      <a href="admin.html" class="admin-link">Panel Admin</a>
    </div>
    <a class="user-chip" href="perfil.html">
      <span class="avatar">C</span>
      <span>Carlos</span>
    </a>
  </nav>

  <main class="content">

    <div class="reservas-header">
      <div>
        <h1>Mis Reservas</h1>
        <p class="subtitle-page">Gestiona y visualiza el historial de tus reservas</p>
      </div>
      <div class="reservas-summary">
        <div class="summary-chip">
          <div class="summary-num" id="activas-count">2</div>
          <div class="summary-label">Activas</div>
        </div>
        <div class="summary-chip">
          <div class="summary-num" id="total-gastado">S/ 395</div>
          <div class="summary-label">Total gastado</div>
        </div>
      </div>
    </div>

    <div class="reservas-tabs" id="reservas-tabs">
      <button class="reservas-tab active" data-tab="todas">Todas</button>
      <button class="reservas-tab" data-tab="confirmada">Confirmadas</button>
      <button class="reservas-tab" data-tab="pendiente">Pendientes</button>
      <button class="reservas-tab" data-tab="cancelada">Canceladas</button>
    </div>

    <div class="reservas-list" id="reservas-list"></div>
    <section class="mt-8">
      <h2 class="text-xl font-bold mb-4">Mis Inscripciones</h2>

      <div id="inscripciones-list">
        <p class="text-gray-500">Cargando inscripciones...</p>
      </div>
    </section>

  </main>

  <script src="assets/js/app.js"></script>
</body>

</html>
